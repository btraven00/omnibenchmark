name: Pixi + Tox Pipeline

env:
  PIXI_VERSION: v0.51.0

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          auth-host: prefix.dev
          auth-token: ${{ secrets.PREFIX_DEV_TOKEN }}

      - name: Run linting
        run: pixi run lint

      - name: Run type checking (optional)
        continue-on-error: true
        run: pixi run typecheck

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          auth-host: prefix.dev
          auth-token: ${{ secrets.PREFIX_DEV_TOKEN }}

      - name: Build wheel
        run: pixi run build

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnibenchmark-wheel
          path: dist/*.whl
          retention-days: 7

  test-short:
    name: Short Tests
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          auth-host: prefix.dev
          auth-token: ${{ secrets.PREFIX_DEV_TOKEN }}

      - name: Run short tests
        run: pixi run test-short

  test-python-versions:
    name: Test Python 3.12 & 3.13
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          auth-host: prefix.dev
          auth-token: ${{ secrets.PREFIX_DEV_TOKEN }}

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: omnibenchmark-wheel
          path: dist/

      - name: Set up Python versions for tox
        uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.13

      - name: Run tox tests with wheel
        run: |
          pixi run pip install dist/*.whl
          pixi run test-tox

  test-integration:
    name: Integration Tests
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          cache: true
          auth-host: prefix.dev
          auth-token: ${{ secrets.PREFIX_DEV_TOKEN }}

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: omnibenchmark-wheel
          path: dist/

      - name: Install wheel for testing
        run: |
          pixi run pip install dist/*.whl

      - name: Install additional system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap

      - name: Set up module environment (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          export MODULEPATH="$HOME/.local/easybuild/modules/all:$GITHUB_WORKSPACE/tests/data/envs"
          echo "MODULEPATH=$MODULEPATH" >> $GITHUB_ENV

      - name: Run integration tests
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            pixi run test-software
          else
            # macOS - skip platform-specific tests
            pixi run pytest -v tests/software/ -k "not apptainer"
          fi
