id: LinearArithmetic
description: Simple linear pipeline for e2e testing with arithmetic operations
version: "1.0"
benchmarker: "E2E Test Suite"
api_version: "0.3.0"
software_backend: host

software_environments:
  host:
    description: "Host environment for direct execution"

stages:
  - id: data
    modules:
      - id: D1
        name: "Dataset 1 - Generate test values"
        software_environment: "host"
        repository:
          url: bundles/dummymodule_aeeb62f.bundle
          commit: aeeb62f
        parameters:
          - values: ["--evaluate", "1+2+3+4+5", "--output", "data.json"]
    outputs:
      - id: data.result
        path: "{dataset}_data.json"

  - id: process
    modules:
      - id: P1
        name: "Double the value"
        software_environment: "host"
        repository:
          url: bundles/dummymodule_aeeb62f.bundle
          commit: aeeb62f
        parameters:
          - values: ["--evaluate", "15*2", "--output", "processed.json"]
    inputs:
      - entries:
          - data.result
    outputs:
      - id: process.result
        path: "processed.json"

  - id: methods
    modules:
      - id: M1
        name: "Add offset"
        software_environment: "host"
        repository:
          url: bundles/dummymodule_aeeb62f.bundle
          commit: aeeb62f
        parameters:
          - values: ["--evaluate", "30+10", "--output", "method.json"]
    inputs:
      - entries:
          - process.result
    outputs:
      - id: methods.result
        path: "method.json"

  - id: metrics
    modules:
      - id: m1
        name: "Final calculation"
        software_environment: "host"
        repository:
          url: bundles/dummymodule_aeeb62f.bundle
          commit: aeeb62f
        parameters:
          - values: ["--evaluate", "40+0", "--output", "metric.json"]
    inputs:
      - entries:
          - methods.result
    outputs:
      - id: metrics.final
        path: "metric.json"
