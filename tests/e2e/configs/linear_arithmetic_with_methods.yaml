id: LinearArithmeticDataset
description: Simple linear pipeline for e2e testing with arithmetic operations
version: "1.0"
benchmarker: "E2E Test Suite"
api_version: "0.3.0"
software_backend: host

software_environments:
  host:
    description: "Host environment for direct execution"

stages:
  - id: data
    modules:
      # this writes to out/data/D1/evaluate-1+2+3+4+5
      - id: D1
        name: "Dataset 1 - Generate test values"
        software_environment: "host"
        repository:
          url: bundles/dummymodule_2e138f9.bundle
          commit: 2e138f9
        parameters:
          - values: ["--evaluate", "1+2+3+4+5"]
      # this writes to out/data/D1/evaluate-20+5
      - id: D2
        name: "Dataset 2 - Generate test values"
        software_environment: "host"
        repository:
          url: bundles/dummymodule_2e138f9.bundle
          commit: 2e138f9
        parameters:
          - values: ["--evaluate", "20+5"]
    outputs:
      - id: data.raw
        path: "{dataset}_data.json"

  - id: methods
    modules:
      - id: M1
        name: "Method 1 - Process data"
        software_environment: "host"
        repository:
          url: bundles/dummymodule_2e138f9.bundle
          commit: 2e138f9
        parameters:
          # --data.raw will be passed as input by us
          - values: ["--evaluate", "input+100", "--input", "data.raw"]
    inputs:
      - entries:
          - data.raw
    outputs:
      - id: methods.result
        # XXX I think this is wrong. This module gets passed --name D1...
        # but I expect name to be M1.
        path: "{dataset}_data.json"
