[project]
name = "omnibenchmark"
description = "A tool for automated scientific benchmarking"
authors = [
    { name = "Almut Lütge", email = "almut.lue@gmail.com" },
    { name = "Izaskun Mallona", email = "izaskun.mallona@gmail.com" },
    { name = "Daniel Incicau", email = "daniel.incicau@gmail.com" },
    { name = "Reto Gerber" },
    { name = "Ben Carrillo" },
]
readme = "README.md"
homepage = "https://github.com/omnibenchmark/omnibenchmark"
repository = "https://github.com/omnibenchmark/omnibenchmark"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
]
requires-python = "~=3.12"

dynamic = ["version"]

dependencies = [
    "click>=8.1.7",
    "python-dateutil>=2.9.0.post0",
    "filelock>=3.4.0",
    "pydantic",
    "spdx-license-list>=3.19",
    "PyYAML",
    "humanfriendly",

    # Cloning modules
    "GitPython>=3.1.0",

    # Workflow
    "snakemake>=8.0",      # modify constraints.txt if you need stricter pinning
    "snakedeploy>=0.10.0",

    # Build tools
    "easybuild>=5.0.0",
    "easybuild-easyblocks>=5.0.0",
    "snakemake-executor-plugin-slurm (>=1.4.0,<2.0.0)",

    # graph visualization (can be made optional)
    "matplotlib==3.8.0",
    "pydot>=3.0.2",

    # can probably move to optional deps
    "tqdm>=4.66.4",

]

[project.optional-dependencies]
s3 = ["minio>=7.2.7", "boto3>=1.34.102", "snakemake-storage-plugin-s3>=0.2.12"]
test = [
    "pytest-cov>=4.1.0",
    "pytest-split>=0.9.0",
    "pytest-xdist>=3.6.1",
    "testcontainers>=4.5.1",
    "pytest-timeout",
]
dev = [
    "ipython",
    "poetry",
    "pre-commit",
    "ruff",
    "typing-extensions",
    "isort",
    "pyright",
]

[project.scripts]
ob = 'omnibenchmark.cli.main:cli'

[build-system]
requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning>=1.8.2,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry]
packages = [{ include = "omnibenchmark" }]
version = "0.0.0"                          # changed dynamically by plugin

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
dirty = false

[tool.poetry.group.test.dependencies]
genbadge = { extras = ["coverage", "tests"], version = "^1.1.1" }
argparse = "^1.4.0"

s3fs = { extras = ["boto3"], version = ">=2023.12.0" }
boto3 = "*"
botocore = "*"
pytest-timeout = "^2.3.1"

[tool.isort]
profile = "black"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

# Strict type checking for new modules
include = ["omnibenchmark"]
strict = ["omnibenchmark/dag/**", "omnibenchmark/model/**"]

# Type checking rules
reportMissingImports = true
reportMissingTypeStubs = false
reportGeneralTypeIssues = "error"
reportPropertyTypeMismatch = "error"
reportFunctionMemberAccess = "error"
reportMissingParameterType = "error"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportIncompatibleMethodOverride = "error"
reportUntypedFunctionDecorator = "warning"
reportUntypedClassDecorator = "warning"
reportUnboundVariable = "error"
reportInvalidStringEscapeSequence = "error"
reportMissingTypeArgument = "error"
reportCallInDefaultInitializer = "error"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryContains = "warning"
reportImplicitStringConcatenation = "warning"
reportInvalidStubStatement = "error"
reportIncompleteStub = "warning"
reportUnsupportedDunderAll = "warning"
reportUnusedExpression = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportMatchNotExhaustive = "error"

# Strict mode settings for new modules
[tool.pyright.strictListInference]
paths = ["omnibenchmark/dag", "omnibenchmark/model"]

[tool.pyright.strictDictionaryInference]
paths = ["omnibenchmark/dag", "omnibenchmark/model"]

[tool.pyright.strictSetInference]
paths = ["omnibenchmark/dag", "omnibenchmark/model"]

[tool.ruff]
line-length = 88 # Match Black's default line length

[tool.ruff.lint]
ignore = ["E203"] # Ignore E203

[tool.coverage.run]
source = ["omnibenchmark"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/venv/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "reports/coverage.xml"
